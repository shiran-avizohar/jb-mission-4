<div class="operations-container">
    <!-- Input for bank account number -->
    <input [(ngModel)]="accountNumber" placeholder="Enter bank account number" type="text" />
  
    <!-- Button to fetch operations -->
    <button (click)="getOperations()">Get Operations</button>
  
    <!-- Display operations if available -->
    <div *ngIf="operations.length > 0">
      <div class="tabs">
        <div class="tab" *ngFor="let operation of operations">
          <div class="tab-content">
            <p><strong>Type:</strong> {{ operation.type }}</p>
            <p><strong>Amount:</strong> {{ operation.amount }}</p>
            <p><strong>Date:</strong> {{ operation.date }}</p>
          </div>
        </div>
      </div>
    </div>
  
    <!-- If no operations found, display a message -->
    <div *ngIf="operations.length === 0" class="no-operations">
      No operations found for this account.
    </div>
  </div>
