<!-- src/app/components/new-operation/new-operation.component.html -->

<div id="action-container">
    <div>
      <label for="accountNumber">Account Number:</label>
      <input id="accountNumber" [value]="accountNumber" (input)="accountNumber = $event.target.value" placeholder="Enter account number" />
    </div>
  
    <div>
      <label for="action">Choose Action:</label>
      <select id="action" [value]="selectedAction" (change)="selectedAction = $event.target.value">
        <option value="withdrawal">Withdrawal</option>
        <option value="deposit">Deposit</option>
        <option value="loan">Loan</option>
      </select>
    </div>
  
    <div>
      <label for="amount">Amount:</label>
      <input id="amount" [value]="amount" (input)="amount = $event.target.value" type="number" placeholder="Enter amount" />
    </div>
  
    <!-- Dynamic UI for loan action -->
    <div *ngIf="selectedAction === 'loan'">
      <label for="payments">Payments:</label>
      <input id="payments" [value]="payments" (input)="payments = $event.target.value" type="number" placeholder="Enter number of payments" />
      
      <label for="interest">Interest Rate:</label>
      <input id="interest" [value]="interest" (input)="interest = $event.target.value" type="number" placeholder="Enter interest rate" />
    </div>
  
    <button (click)="saveOperation()">Save Operation</button>
  </div>
